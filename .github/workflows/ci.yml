name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive infra
      - name: Validate bootstrap and demo
        run: |
          for d in bootstrap demo; do
            terraform -chdir=infra/$d init -backend=false -input=false
            terraform -chdir=infra/$d validate
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Detekt and tests
        working-directory: app
        run: ./gradlew detekt test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/detekt/
            app/build/test-results/

      - name: Build image and start the compose stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Smoke test
        env:
          API_KEY: dev-api-key
        run: scripts/smoke-test.sh http://localhost:8080 | tee smoke-test.txt

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose.log

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            smoke-test.txt
            compose.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
