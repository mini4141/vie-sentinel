name: terraform-plan

# Runs `terraform plan` for the demo stack on pull requests and comments the result.
# Needs repository variables: AWS_PLAN_ROLE_ARN (from bootstrap output plan_role_arn) and TF_STATE_BUCKET.

on:
  pull_request:
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-1

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: infra/demo
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        id: plan
        working-directory: infra/demo
        run: terraform plan -input=false -lock=false -no-color 2>&1 | tee plan.txt

      - name: Comment plan on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'terraform plan produced no output';
            try { body = fs.readFileSync('infra/demo/plan.txt', 'utf8'); } catch (e) {}
            if (body.length > 60000) body = body.slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### terraform plan (infra/demo)\n```\n' + body + '\n```',
            });
